# DSH Projects preview bundle (M1 thin slice)
- insert:
    - id: app-memory
      name: '@dsh-projects/app-bundle/memory'
      config:
        projectDir: '__PROJECTS_HOME__/hello-project'
        rootDir: '__PROJECTS_HOME__/hello-project/.memory'
        maxIndexBytes: 4096
        maxIndexLines: 200

    - id: app-project-tools
      name: '@dsh-projects/app-bundle/project-tools'
      config:
        projectDir: '__PROJECTS_HOME__/hello-project'

    - id: app-ui
      name: '@dsh-projects/app-bundle'

    - id: app-projects
      name: '@dsh-projects/app-bundle/projects'
      config:
        projectDir: '__PROJECTS_HOME__/hello-project'
